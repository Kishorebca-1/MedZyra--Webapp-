<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Choose Your Language | MedZyra</title>

    <link rel="stylesheet" href="../CSS/language.css">
</head>

<body>

    <!-- ================= HEADER ================= -->

    <header class="top-header">

        <div class="brand">

            <div class="brand-icon">
                <span class="plus-horizontal"></span>
                <span class="plus-vertical"></span>
                <span class="heartbeat">⌁</span>
            </div>

            <span class="brand-name">MedZyra</span>

        </div>

        <div class="header-tagline">
            Your health. Our priority.
        </div>

    </header>


    <!-- ================= MAIN ================= -->

    <main class="language-page">


        <!-- Decorative medical plus -->

        <div class="decor-plus decor-plus-left">
            +
        </div>


        <!-- Decorative heart -->

        <div class="decor-heart">
            ♡
            <span>⌁</span>
        </div>


        <!-- Decorative circles -->

        <div class="decor-circle circle-left"></div>
        <div class="decor-circle circle-right"></div>


        <!-- ================= CONTENT ================= -->

        <section class="language-container">


            <!-- Heading -->

            <h1>
                Choose Your
                <span>Language</span>
            </h1>


            <p class="subtitle">
                Select the language you're most comfortable with
                <br class="desktop-break">
                for your MedZyra health journey.
            </p>


            <!-- ================= LANGUAGE CARDS ================= -->

            <div class="language-options">


                <!-- Bengali -->

                <button
                    class="language-card"
                    data-language="bengali"
                    type="button">

                    <div class="language-symbol bengali-symbol">
                        অ
                    </div>

                    <div class="language-name bengali-text">
                        বাংলা
                    </div>

                    <div class="language-english">
                        Bengali
                    </div>

                    <div class="selected-check">
                        ✓
                    </div>

                </button>


                <!-- English -->

                <button
                    class="language-card selected"
                    data-language="english"
                    type="button">

                    <div class="language-symbol english-symbol">
                        ◎
                    </div>

                    <div class="language-name">
                        English
                    </div>

                    <div class="language-english">
                        English
                    </div>

                    <div class="selected-check">
                        ✓
                    </div>

                </button>


                <!-- Hindi -->

                <button
                    class="language-card"
                    data-language="hindi"
                    type="button">

                    <div class="language-symbol hindi-symbol">
                        अ
                    </div>

                    <div class="language-name hindi-text">
                        हिन्दी
                    </div>

                    <div class="language-english">
                        Hindi
                    </div>

                    <div class="selected-check">
                        ✓
                    </div>

                </button>


            </div>


            <!-- Continue Button -->

            <button
                class="continue-button"
                id="continueButton"
                type="button">

                <span>Continue</span>

                <span class="arrow">→</span>

            </button>


        </section>


        <!-- ================= DECORATIVE LEAVES ================= -->

        <div class="leaf-decoration left-leaves">

            <span class="leaf leaf-1"></span>
            <span class="leaf leaf-2"></span>
            <span class="leaf leaf-3"></span>
            <span class="leaf leaf-4"></span>
            <span class="leaf leaf-5"></span>

        </div>


        <div class="leaf-decoration right-leaves">

            <span class="leaf leaf-1"></span>
            <span class="leaf leaf-2"></span>
            <span class="leaf leaf-3"></span>
            <span class="leaf leaf-4"></span>

        </div>


        <!-- Bottom quote -->

        <div class="health-quote">

            <span>Health</span>
            <span>has no language</span>

        </div>


    </main>


    <!-- ================= JAVASCRIPT ================= -->

    <script src="../JS/i18n.js"></script>
    <script src="../JS/language.js"></script>

</body>

</html>
