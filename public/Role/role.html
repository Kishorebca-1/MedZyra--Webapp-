<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Welcome to MedZyra</title>

    <link
        rel="stylesheet"
        href="../CSS/role.css">
</head>

<body>

    <!-- =========================================
         HEADER
    ========================================== -->

    <header class="top-header">

        <div class="brand">

            <div class="brand-icon">

                <span class="plus-horizontal"></span>
                <span class="plus-vertical"></span>

                <span class="heartbeat">⌁</span>

            </div>

            <span class="brand-name">
                MedZyra
            </span>

        </div>


        <div class="header-tagline">
            Your health. Our priority.
        </div>

    </header>



    <!-- =========================================
         MAIN
    ========================================== -->

    <main class="role-page">


        <!-- Decorative Plus -->

        <div class="decor-plus">
            +
        </div>


        <!-- Decorative Heart -->

        <div class="decor-heart">

            ♡

            <span>⌁</span>

        </div>


        <!-- Decorative circles -->

        <div class="decor-circle circle-left"></div>

        <div class="decor-circle circle-right"></div>



        <!-- =====================================
             CONTENT
        ====================================== -->

        <section class="role-container">


            <!-- Welcome pill -->

            <div class="welcome-pill">

                <span class="sparkle">
                    ✦
                </span>

                <span>
                    Welcome to MedZyra
                </span>

            </div>



            <!-- Heading -->

            <h1>
                Who are
                <span>you?</span>
            </h1>



            <!-- Subtitle -->

            <p class="subtitle">

                Select the option that best describes you
                to continue with your MedZyra experience.

            </p>



            <!-- =================================
                 ROLE CARDS
            ================================== -->

            <div class="role-options">


                <!-- =================================
                     PATIENT
                ================================== -->

                <button
                    class="role-card"
                    data-role="patient"
                    type="button">


                    <!-- Illustration -->

                    <div class="illustration patient">

                        <div class="person-head">

                            <div class="hair"></div>

                            <div class="face">

                                <span class="eye left"></span>
                                <span class="eye right"></span>

                                <span class="smile"></span>

                            </div>

                        </div>


                        <div class="person-body">

                            <div class="neck"></div>

                            <div class="shirt">

                                <span class="shirt-dot dot1"></span>
                                <span class="shirt-dot dot2"></span>
                                <span class="shirt-dot dot3"></span>

                            </div>

                        </div>


                        <div class="medical-plus">
                            +
                        </div>

                    </div>



                    <!-- Title -->

                    <h2>
                        I am a Patient
                    </h2>



                    <!-- Description -->

                    <p>

                        I want to share my medical history,
                        documents and health concerns.

                    </p>



                    <!-- Arrow -->

                    <span class="role-arrow">
                        →
                    </span>


                </button>



                <!-- =================================
                     DOCTOR
                ================================== -->

                <button
                    class="role-card"
                    data-role="doctor"
                    type="button">


                    <!-- Illustration -->

                    <div class="illustration doctor">

                        <div class="doctor-head">

                            <div class="doctor-hair"></div>

                            <div class="doctor-face">

                                <span class="doctor-eye left"></span>
                                <span class="doctor-eye right"></span>

                                <span class="doctor-smile"></span>

                            </div>

                            <div class="glasses glasses-left"></div>
                            <div class="glasses glasses-right"></div>

                        </div>


                        <div class="doctor-body">

                            <div class="doctor-coat">

                                <div class="shirt-line"></div>

                                <div class="stethoscope">

                                    <span class="tube"></span>
                                    <span class="chest-piece"></span>

                                </div>

                                <div class="doctor-badge">
                                    +
                                </div>

                            </div>

                        </div>


                        <div class="doctor-medical-plus">
                            +
                        </div>

                    </div>



                    <!-- Title -->

                    <h2>
                        I am a Doctor
                    </h2>



                    <!-- Description -->

                    <p>

                        I want to access patient history,
                        records and consultation tools.

                    </p>



                    <!-- Arrow -->

                    <span class="role-arrow">
                        →
                    </span>


                </button>


            </div>



        </section>



        <!-- =====================================
             DECORATIVE LEAVES
        ====================================== -->

        <div class="leaf-decoration left-leaves">

            <span class="leaf leaf-1"></span>
            <span class="leaf leaf-2"></span>
            <span class="leaf leaf-3"></span>
            <span class="leaf leaf-4"></span>
            <span class="leaf leaf-5"></span>

        </div>



        <div class="leaf-decoration right-leaves">

            <span class="leaf leaf-1"></span>
            <span class="leaf leaf-2"></span>
            <span class="leaf leaf-3"></span>
            <span class="leaf leaf-4"></span>

        </div>



        <!-- Bottom quote -->

        <div class="health-quote">

            <span>Better health for</span>

            <span>a brighter tomorrow.</span>

        </div>


    </main>


    <!-- =========================================
         JAVASCRIPT
    ========================================== -->

    <script src="../JS/i18n.js"></script>
    <script src="../JS/role.js"></script>
</body>

</html>
